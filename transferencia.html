<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transferencia</title>

    <link rel="stylesheet" href="css/transferencia.css?v=10">

</head>

<body>


<!-- ============================
     HEADER
============================ -->

<header class="header">

    <div class="header-inner">

        <img
            class="logo-travel-rock"
            src="img/travel-rock-logo.png"
            alt="Travel Rock"
        >

        <span class="shop-label">
            SHOP EGRESADOS
        </span>

    </div>

</header>


<!-- ============================
     LOADER
============================ -->

<div id="loader" class="loader">

    <div class="loader-card">

        <div class="spinner"></div>

        <p>Cargando datos...</p>

    </div>

</div>


<!-- ============================
     TRANSFERENCIA
============================ -->

<main class="tarjeta">


    <!-- FOTO -->

    <img
        id="foto"
        alt="Producto"
    >


    <div class="contenido">


        <!-- TITULO -->

        <h1 id="titulo"></h1>


        <!-- INSTRUCCIONES -->

        <div class="instrucciones">

            <h3>
                ¿Cómo comprar?
            </h3>

            <ol>

                <li>
                    Copiá el Alias o el CVU.
                </li>

                <li>
                    Realizá la transferencia por el importe indicado.
                </li>

                <li>
                    Una vez finalizada, presioná
                    <strong>
                        "Ya realicé la transferencia"
                    </strong>.
                </li>

            </ol>

        </div>


        <!-- IMPORTE -->

        <div class="precio">

            <label>
                Total a pagar
            </label>

            <h2 id="precio"></h2>

        </div>


        <!-- ALIAS -->

        <div class="dato">

            <label>
                Alias
            </label>

            <div
                class="valor"
                id="alias"
            ></div>

            <button id="copiarAlias">
                Copiar Alias
            </button>

        </div>


        <!-- CVU / CBU -->

        <div class="dato">

            <label>
                CVU / CBU
            </label>

            <div
                class="valor"
                id="cbu"
            ></div>

            <button id="copiarCBU">
                Copiar CVU
            </button>

        </div>


        <!-- TITULAR -->

        <div class="dato">

            <label>
                Titular
            </label>

            <div
                class="valor"
                id="titular"
            ></div>

        </div>


        <!-- CONFIRMAR -->

        <button id="btnConfirmar">

            Ya realicé la transferencia

        </button>


    </div>

</main>


<!-- ============================
     SCRIPTS
============================ -->

<script src="js/config.js?v=4"></script>

<script src="js/api.js?v=1"></script>

<script src="js/transferencia.js?v=3"></script>


</body>

</html>
