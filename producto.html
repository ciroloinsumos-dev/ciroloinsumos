<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Travel Rock | Shop</title>

    <link rel="stylesheet" href="css/reset.css?v=1">
    <link rel="stylesheet" href="css/estilos.css?v=1">
    <link rel="stylesheet" href="css/producto.css?v=7">

</head>

<body>


<div id="loader" class="loader">

    <div class="loader-card">

        <div class="spinner"></div>

        <p id="loaderTexto">
            Cargando producto...
        </p>

    </div>

</div>


<header class="header">

    <div class="header-inner">

        <img
            class="logo-travel-rock"
            src="img/travel-rock-logo.png"
            alt="Travel Rock"
        >

        <span class="shop-label">
            SHOP EGRESADOS
        </span>

    </div>

</header>


<main class="producto">


    <!-- FOTO DEL PRODUCTO -->

    <section class="foto-producto">

        <div class="etiqueta-producto">
            RECUERDO DE TU VIAJE
        </div>

        <div class="foto-marco">

            <img
                id="foto"
                alt="Producto"
            >

        </div>

    </section>


    <!-- INFORMACIÓN DEL PRODUCTO -->

    <section class="contenido">


        <div class="marca-superior">
            TRAVEL ROCK · BARILOCHE
        </div>


        <h1 id="titulo"></h1>


        <h2 id="precio"></h2>


        <p id="descripcion"></p>


        <!-- DATOS -->

        <div class="datos">

            <p>

                <strong>
                    <span class="dato-icono">◆</span>
                    Categoría
                </strong>

                <span id="categoria"></span>

            </p>


            <p>

                <strong>
                    <span class="dato-icono">●</span>
                    Marca
                </strong>

                <span id="marca"></span>

            </p>


            <p>

                <strong>
                    <span class="dato-icono">⌖</span>
                    Punto de venta
                </strong>

                <span id="puntoVenta"></span>

            </p>

        </div>


        <!-- COORDINADOR -->

        <div class="coordinador-box">

            <label for="coordinador">
                ELEGÍ TU COORDINADOR
            </label>

            <div class="select-wrap">

                <span class="select-icon">
                    ●
                </span>

                <select id="coordinador">

                    <option value="">
                        Seleccioná un coordinador
                    </option>

                </select>

                <span class="select-arrow">
                    ⌄
                </span>

            </div>

        </div>


        <!-- FORMAS DE PAGO -->

        <div class="formasPago">

            <div class="titulo-pago">
                ¿CÓMO QUERÉS PAGAR?
            </div>

            <div class="botones">

                <button id="btnTransferencia">

                    <span class="boton-icono">
                        ↗
                    </span>

                    <span>
                        Transferencia
                    </span>

                </button>


                <a
                    id="btnMP"
                    href="#"
                >

                    <span class="boton-icono">
                        ▣
                    </span>

                    <span>
                        Mercado Pago
                    </span>

                </a>

            </div>

        </div>


        <!-- FRASE FINAL -->

        <div class="footer-frase">

            <span>
                EL VIAJE TERMINA.
            </span>

            <strong>
                EL RECUERDO NO.
            </strong>

        </div>


    </section>

</main>


<script src="js/config.js?v=4"></script>
<script src="js/api.js?v=1"></script>
<script src="js/producto.js?v=7"></script>

</body>

</html>
