<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Rock | Compra registrada</title>

    <link rel="stylesheet" href="css/gracias.css?v=2">

</head>

<body>

    <header class="header">

        <div class="header-inner">

            <img
                class="logo-travel-rock"
                src="img/travel-rock-logo.png"
                alt="Travel Rock"
            >

            <span class="shop-label">
                SHOP EGRESADOS
            </span>

        </div>

    </header>


    <main class="contenedor">

        <section class="tarjeta">

            <div class="check">

                <span>✓</span>

            </div>


            <div class="marca">
                TRAVEL ROCK · BARILOCHE
            </div>


            <h1>
                ¡Compra registrada!
            </h1>


            <p class="principal">
                Registramos correctamente tu solicitud.
            </p>


            <div class="operacion">

                <label>
                    CÓDIGO DE OPERACIÓN
                </label>

                <h2 id="operacion"></h2>

            </div>


            <div class="aviso">

                <span class="aviso-icono">
                    !
                </span>

                <p>
                    Presentá este código al momento de retirar tu producto.
                </p>

            </div>


            <button id="btnInicio">

                Finalizar

            </button>


            <div class="frase">

                <span>
                    EL VIAJE TERMINA.
                </span>

                <strong>
                    EL RECUERDO NO.
                </strong>

            </div>

        </section>

    </main>


    <script src="js/config.js?v=4"></script>
    <script src="js/api.js?v=1"></script>
    <script src="js/gracias.js?v=2"></script>

</body>

</html>
