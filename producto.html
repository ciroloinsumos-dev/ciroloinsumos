<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Producto</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/producto.css">

</head>

<body>
    
<div id="loader" class="loader">

    <div class="loader-card">

        <div class="spinner"></div>

        <p>Cargando producto...</p>

    </div>

</div>
    <main class="producto">

    <img id="foto">

    <div class="contenido">

        <h1 id="titulo"></h1>

        <p id="descripcion"></p>

        <div class="datos">

            <p><strong>Categoría:</strong> <span id="categoria"></span></p>

            <p><strong>Peso:</strong> <span id="peso"></span></p>

            <p><strong>Marca:</strong> <span id="marca"></span></p>

            <p><strong>Taller:</strong> <span id="taller"></span></p>

        </div>

        <h2 id="precio"></h2>

        <div class="botones">

            <button id="btnTransferencia">
                Pagar por Transferencia
            </button>

            <a id="btnMP" href="#">
                Pagar con Mercado Pago
            </a>

        </div>

    </div>

</main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/producto.js"></script>

</body>

</html>
