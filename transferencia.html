<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transferencia</title>

    <link rel="stylesheet" href="css/transferencia.css">

</head>

<body>

    <div id="loader" class="loader">

        <div class="loader-card">

            <div class="spinner"></div>

            <p>Cargando datos...</p>

        </div>

    </div>

    <main class="tarjeta">

        <img id="foto">

        <div class="contenido">

            <h1 id="titulo"></h1>

            <div class="instrucciones">

                <h3>¿Cómo comprar?</h3>

                <ol>
                    <li>Copiá el Alias o el CVU.</li>
                    <li>Realizá la transferencia por el importe indicado.</li>
                    <li>Una vez finalizada, presioná <strong>"Ya realicé la transferencia"</strong>.</li>
                </ol>

            </div>

            <div class="precio">

                <label>Total a pagar</label>

                <h2 id="precio"></h2>

            </div>

            <div class="dato">

                <label>Alias</label>

                <div class="valor" id="alias"></div>

                <button id="copiarAlias">
                    Copiar Alias
                </button>

            </div>

            <div class="dato">

                <label>CVU / CBU</label>

                <div class="valor" id="cbu"></div>

                <button id="copiarCBU">
                    Copiar CVU
                </button>

            </div>

            <div class="dato">

                <label>Titular</label>

                <div class="valor" id="titular"></div>

            </div>

            <button id="btnConfirmar">

                Ya realicé la transferencia

            </button>

        </div>

    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/transferencia.js"></script>

</body>

</html>
