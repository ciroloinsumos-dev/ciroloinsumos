<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Producto</title>

    <link rel="stylesheet" href="css/reset.css?v=1">
    <link rel="stylesheet" href="css/estilos.css?v=1">
    <link rel="stylesheet" href="css/producto.css?v=2">

</head>

<body>

<!-- VERSION PRUEBA 11/8_13:05 -->

<div id="loader" class="loader">

    <div class="loader-card">

        <div class="spinner"></div>

        <p id="loaderTexto">Cargando producto...</p>

    </div>

</div>

<main class="producto">

    <img id="foto" alt="Producto">

    <div class="contenido">

        <h1 id="titulo"></h1>

        <h2 id="precio"></h2>

        <p id="descripcion"></p>

        <div class="datos">

            <p>
                <strong>Categoría</strong>
                <span id="categoria"></span>
            </p>

            <p>
                <strong>Peso</strong>
                <span id="peso"></span>
            </p>

            <p>
                <strong>Marca</strong>
                <span id="marca"></span>
            </p>

            <p>
                <strong>Punto de Venta</strong>
                <span id="puntoVenta"></span>
            </p>

        </div>

        <div class="formasPago">

            <p>Pagá por Transferencia o Mercado Pago</p>

            <div class="botones">

                <button id="btnTransferencia">
                    Transferencia
                </button>

                <a id="btnMP" href="#">
                    Mercado Pago
                </a>

            </div>

        </div>

    </div>

</main>

<script src="js/config.js?v=4"></script>
<script src="js/api.js?v=1"></script>
<script src="js/producto.js?v=3"></script>

</body>

</html>
